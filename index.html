<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAY BITAW na CAlCULATOR</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="floating heart-one">♡</div>
    <div class="floating heart-two">♡</div>
    <div class="floating star-one">✦</div>
    <div class="floating star-two">✧</div>


    <main class="calculator-container">

        <div class="calculator-header">

            <div>
                <p class="mini-title">May bitaw na</p>

                <h1>
                    Calculator ni JD<span>♡</span>
                </h1>
            </div>

            <div class="sparkle">✦</div>

        </div>


        <div class="calculator">

            <div class="display-box">

                <div id="history" class="history"></div>

                <div id="display" class="display">
                    <span id="empty-face">
                        ૮ ˶ᵔ ᵕ ᵔ˶ ა
                    </span>
                </div>

                <div id="message" class="message">
                    type something ♡
                </div>

            </div>


            <div class="buttons">

                <button class="btn function" data-action="clear">
                    AC
                </button>

                <button class="btn function" data-action="delete">
                    ⌫
                </button>

                <button class="btn function" data-action="percent">
                    %
                </button>

                <button class="btn operator"
                    data-action="operator"
                    data-value="/">
                    ÷
                </button>


                <button class="btn number" data-value="7">
                    7
                </button>

                <button class="btn number" data-value="8">
                    8
                </button>

                <button class="btn number" data-value="9">
                    9
                </button>

                <button class="btn operator"
                    data-action="operator"
                    data-value="*">
                    ×
                </button>


                <button class="btn number" data-value="4">
                    4
                </button>

                <button class="btn number" data-value="5">
                    5
                </button>

                <button class="btn number" data-value="6">
                    6
                </button>

                <button class="btn operator"
                    data-action="operator"
                    data-value="-">
                    −
                </button>


                <button class="btn number" data-value="1">
                    1
                </button>

                <button class="btn number" data-value="2">
                    2
                </button>

                <button class="btn number" data-value="3">
                    3
                </button>

                <button class="btn operator"
                    data-action="operator"
                    data-value="+">
                    +
                </button>


                <button class="btn function" data-action="sign">
                    ±
                </button>

                <button class="btn number" data-value="0">
                    0
                </button>

                <button class="btn number" data-value=".">
                    .
                </button>

                <button class="btn equals" data-action="equals">
                    =
                </button>

            </div>


            <div class="footer">
                made</span> for jdsodump
            </div>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
